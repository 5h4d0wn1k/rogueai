[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rogueai"
version = "1.0.0"
description = "Agentic AI red-team & adversarial agent orchestration framework (authorized testing only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com" }]
keywords = ["security", "red-team", "agentic-ai", "offensive", "authorized-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
rogueai = "rogueai.cli:main"

[tool.setuptools]
packages = ["rogueai"]

[tool.setuptools.package-data]
rogueai = ["playbooks/*.json"]